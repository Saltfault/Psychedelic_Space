name: Export desktop builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE_TAG: "4.7.2-stable"
  GODOT_EDITOR_ZIP: "Godot_v4.7.2-stable_linux.x86_64.zip"
  GODOT_TEMPLATES_TPZ: "Godot_v4.7.2-stable_export_templates.tpz"

jobs:
  export-desktop:
    name: Export Windows, Linux, and macOS (GitHub only)
    # Forgejo also discovers workflows in .github/workflows when no Forgejo-specific workflow exists.
    # Keep this export job exclusive to GitHub.com.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project source
        uses: actions/checkout@v4
        with:
          # GitHub's LFS store is not the source of the project's binary assets.
          lfs: false

      - name: Fetch Git LFS assets from Forgejo
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git remote add forgejo-lfs \
            https://forgejo.hearthhome.lol/Saltfault/Psychedelic_Space.git
          git lfs fetch forgejo-lfs "$GITHUB_SHA"
          git lfs checkout

      - name: Download Godot and official export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE_TAG}/${GODOT_EDITOR_ZIP}" \
            --output "$RUNNER_TEMP/godot-editor.zip"
          unzip -q "$RUNNER_TEMP/godot-editor.zip" -d "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE_TAG}/${GODOT_TEMPLATES_TPZ}" \
            --output "$RUNNER_TEMP/export-templates.tpz"
          unzip -q "$RUNNER_TEMP/export-templates.tpz" -d "$RUNNER_TEMP/templates"
          install -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a "$RUNNER_TEMP/templates/templates/." \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Disable editor docks for headless export
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          project = Path("project.godot")
          config = project.read_text()
          section = "[editor_plugins]"
          start = config.find(section)
          if start >= 0:
              end = config.find("\n[", start + len(section))
              if end < 0:
                  end = len(config)
              config = config[:start] + section + "\nenabled=PackedStringArray()\n" + config[end:]
              project.write_text(config)
          PY

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --editor --path . --import --quit

      - name: Export desktop targets
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p build/windows-x86_64 build/windows-arm64 \
            build/linux-x86_64 build/linux-arm64 build/macos-universal

          verify_export() {
            local output="$1"
            local format="$2"
            local architecture="$3"
            local description
            local machine
            local pck
            local size

            test -s "$output" || {
              echo "::error::Godot did not produce $output"
              return 1
            }
            size="$(stat -c '%s' "$output")"
            test "$size" -gt 1048576 || {
              echo "::error::Export is unexpectedly small ($size bytes): $output"
              return 1
            }

            case "$format" in
              windows)
                description="$(file -b "$output")"
                [[ "$description" == *"PE32+"* ]] || {
                  echo "::error::Not a 64-bit Windows executable: $description"
                  return 1
                }
                if [[ "$architecture" == "x86_64" ]]; then
                  [[ "$description" == *"x86-64"* ]] || {
                    echo "::error::Expected x86-64 Windows executable; file reports: $description"
                    return 1
                  }
                else
                  [[ "$description" == *"Aarch64"* || "$description" == *"ARM aarch64"* || "$description" == *"ARM64"* ]] || {
                    echo "::error::Expected ARM64 Windows executable; file reports: $description"
                    return 1
                  }
                fi
                pck="${output%.*}.pck"
                test -s "$pck" || {
                  echo "::error::Missing PCK sidecar required by this non-embedded export: $pck"
                  return 1
                }
                [[ "$(head -c 4 "$pck")" == "GDPC" ]] || {
                  echo "::error::Invalid Godot PCK header: $pck"
                  return 1
                }
                ;;
              linux)
                machine="$(readelf -h "$output" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
                if [[ "$architecture" == "x86_64" ]]; then
                  [[ "$machine" == *"X86-64"* ]] || {
                    echo "::error::Expected x86-64 Linux executable; readelf reports: ${machine:-no machine field}"
                    return 1
                  }
                else
                  [[ "$machine" == *"AArch64"* ]] || {
                    echo "::error::Expected ARM64 Linux executable; readelf reports: ${machine:-no machine field}"
                    return 1
                  }
                fi
                pck="${output%.*}.pck"
                test -s "$pck" || {
                  echo "::error::Missing PCK sidecar required by this non-embedded export: $pck"
                  return 1
                }
                [[ "$(head -c 4 "$pck")" == "GDPC" ]] || {
                  echo "::error::Invalid Godot PCK header: $pck"
                  return 1
                }
                ;;
              macos)
                unzip -tq "$output" || {
                  echo "::error::Invalid macOS export archive: $output"
                  return 1
                }
                unzip -Z1 "$output" | grep '/Contents/MacOS/PsychedelicSpaceGame$' >/dev/null || {
                  echo "::error::macOS archive is missing the PsychedelicSpaceGame app executable"
                  return 1
                }
                ;;
            esac
            echo "Validated $format $architecture export: $output ($size bytes)"
          }

          export_target() {
            local preset="$1"
            local output="$2"
            local format="$3"
            local architecture="$4"
            local export_status
            local log_file="$RUNNER_TEMP/godot-export-${format}-${architecture}.log"
            local export_details

            echo "::group::Export $preset"
            set +e
            "$GODOT" --headless --path . --export-release "$preset" "$output" 2>&1 | tee "$log_file"
            export_status=${PIPESTATUS[0]}
            set -e

            if [[ "$export_status" -ne 0 ]]; then
              echo "::warning::Godot export preset '$preset' exited with status $export_status; validating the generated artifact before continuing."
              export_details="$(tail -n 12 "$log_file" | tr '\n' ' ' | sed 's/::/%3A%3A/g')"
              echo "::error title=Godot export output::$export_details"
            fi
            local validation_status=0
            if verify_export "$output" "$format" "$architecture"; then
              validation_status=0
            else
              validation_status=$?
            fi
            echo "::endgroup::"
            return "$validation_status"
          }

          export_target "Windows Desktop" \
            build/windows-x86_64/PsychedelicSpaceGame.exe windows x86_64
          export_target "Windows ARM64" \
            build/windows-arm64/PsychedelicSpaceGame.exe windows arm64
          export_target "Linux x86_64" \
            build/linux-x86_64/PsychedelicSpaceGame.x86_64 linux x86_64
          export_target "Linux ARM64" \
            build/linux-arm64/PsychedelicSpaceGame.arm64 linux arm64
          export_target "macOS Universal" \
            build/macos-universal/PsychedelicSpaceGame.zip macos universal

          chmod +x build/linux-x86_64/PsychedelicSpaceGame.x86_64
          chmod +x build/linux-arm64/PsychedelicSpaceGame.arm64
          tar -czf build/PsychedelicSpace-Linux-x86_64.tar.gz -C build/linux-x86_64 . || {
            echo "::error::Could not package the Linux x86-64 export"
            exit 1
          }
          tar -czf build/PsychedelicSpace-Linux-ARM64.tar.gz -C build/linux-arm64 . || {
            echo "::error::Could not package the Linux ARM64 export"
            exit 1
          }

      - name: Upload desktop builds
        uses: actions/upload-artifact@v4
        with:
          name: PsychedelicSpace-desktop-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/windows-x86_64/
            build/windows-arm64/
            build/PsychedelicSpace-Linux-x86_64.tar.gz
            build/PsychedelicSpace-Linux-ARM64.tar.gz
            build/macos-universal/PsychedelicSpaceGame.zip
